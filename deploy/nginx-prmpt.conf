# PRMPT — фрагмент конфигурации Nginx
#
# Прод-адрес приложения: https://freejam.online/prmpt/
# Вставляется внутрь существующего server-блока для freejam.online
# (см. /etc/nginx/sites-available/freejam.online) ПЕРЕД строкой
#   location / { try_files $uri $uri/ =404; }
#
# Сервер приложения слушает 127.0.0.1:8030 и сам понимает префикс /prmpt,
# поэтому proxy_pass указывается БЕЗ завершающего слэша (URI передаётся целиком,
# включая /prmpt/) — так не требуется rewrite и не ломаются пути к ассетам,
# которые Vite собирает с base=/prmpt/.

    # PRMPT — GameDev Prompt & Markdown Architect (SPA + REST API)
    location = /prmpt { return 301 /prmpt/; }

    location /prmpt/ {
        proxy_pass http://127.0.0.1:8030;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /prmpt;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_buffering on;

        # ZIP-архивы не кэшируем, ассеты с хэшем — надолго
        gzip on;
        gzip_types text/html text/css application/javascript text/javascript
                   application/json image/svg+xml;
        gzip_min_length 512;
    }
