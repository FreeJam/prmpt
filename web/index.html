<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F6F5F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16181C" media="(prefers-color-scheme: dark)" />
    <title>PRMPT — конструктор GDD, ТЗ и промптов для игры</title>
    <meta name="description" content="Пошаговый конструктор документации для разработки игр с ИИ-агентами: GDD, техническое ТЗ, системный промпт и первая задача для OpenCode, Cursor, Aider, Claude Code, Codex." />
    <meta property="og:title" content="PRMPT — конструктор документации для игры" />
    <meta property="og:description" content="8 коротких шагов — и у вас GDD, ТЗ, промпт для ИИ-агента и первая задача. Скачивается архивом, кладётся в проект." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://freejam.online/prmpt/" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232F4C7E'/%3E%3Cpath d='M10 24V8h7.5a5 5 0 0 1 0 10H10' fill='none' stroke='%23F6F5F2' stroke-width='2.6' stroke-linejoin='round'/%3E%3Ccircle cx='23' cy='23' r='2.4' fill='%23F2C14E'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <script>
      // Тема ставится до первой отрисовки, чтобы не было вспышки
      (function () {
        try {
          var t = localStorage.getItem('prmpt.theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
          document.documentElement.classList.toggle('dark', t === 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
