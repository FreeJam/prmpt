# PRMPT — альтернативный запуск через Docker (на VPS используется systemd + Nginx)
services:
  prmpt:
    build:
      context: .
      dockerfile: Dockerfile
    image: prmpt:1.0.0
    container_name: prmpt
    restart: unless-stopped
    environment:
      PORT: 8030
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8030:8030"
    volumes:
      - prmpt-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8030/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 4s
      retries: 3

volumes:
  prmpt-data:
